name: Validate JSON

on:
  push:
    branches: [Dev, main, nightmare-edition]
  pull_request:
    branches: [Dev, main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files (timed)
        run: time python .github/scripts/validate_json.py
