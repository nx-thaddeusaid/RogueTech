name: Check Cross-File References

on:
  push:
    branches: [Dev, main, nightmare-edition]
  pull_request:
    branches: [Dev, main]

jobs:
  check-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check mechdef/vehicledef → chassisdef references
        run: python .github/scripts/check_refs.py
